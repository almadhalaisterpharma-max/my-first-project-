<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسعار العملات والمعادن - يمن تودي</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- الشريط العلوي -->
    <header class="bg-emerald-800 text-amber-400 p-4 shadow-md text-center sticky top-0 z-50">
        <h1 class="text-xl font-bold">أسعار العملات والمعادن - يمن تودي</h1>
        <p class="text-xs text-white mt-1">تحديث فوري ومباشر</p>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-4">

        <!-- قسم أسعار الصرف -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <h2 class="text-emerald-700 font-bold border-b pb-2 mb-3 flex items-center gap-2">
                💵 أسعار الصرف اليومية
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-center border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-xs text-gray-500 border-b">
                            <th class="p-2 text-right">العملة</th>
                            <th class="p-2">شراء</th>
                            <th class="p-2">بيع</th>
                        </tr>
                    </thead>
                    <tbody class="text-sm divide-y divide-gray-100">
                        <tr>
                            <td class="p-3 text-right font-medium">سعودي (صنعاء)</td>
                            <td class="p-3 text-emerald-600 font-bold">140</td>
                            <td class="p-3 text-red-500 font-bold">141</td>
                        </tr>
                        <tr>
                            <td class="p-3 text-right font-medium">دولار (صنعاء)</td>
                            <td class="p-3 text-emerald-600 font-bold">530</td>
                            <td class="p-3 text-red-500 font-bold">534</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- قسم أسعار الذهب والفضة -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <h2 class="text-emerald-700 font-bold border-b pb-2 mb-3 flex items-center gap-2">
                ✨ أسعار الذهب والمعادن
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-center border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-xs text-gray-500 border-b">
                            <th class="p-2 text-right">المعدن</th>
                            <th class="p-2">سعر الجرام</th>
                        </tr>
                    </thead>
                    <tbody class="text-sm divide-y divide-gray-100">
                        <tr>
                            <td class="p-3 text-right font-medium">ذهب عيار 21</td>
                            <td class="p-3 text-amber-600 font-bold">32,500 ريال</td>
                        </tr>
                        <tr>
                            <td class="p-3 text-right font-medium">الجنيه الذهب</td>
                            <td class="p-3 text-amber-600 font-bold">260,000 ريال</td>
                        </tr>
                        <tr>
                            <td class="p-3 text-right font-medium">جرام الفضة</td>
                            <td class="p-3 text-gray-600 font-bold">450 ريال</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- مساحة إعلانية وهمية مؤقتاً لتتخيل مكانها -->
        <div class="bg-gray-200 text-gray-500 text-xs p-3 text-center rounded-lg border border-dashed border-gray-300">
            مساحة إعلانات Google AdMob (مصدر أرباحك اليومية)
        </div>

    </main>

</body>
</html>
